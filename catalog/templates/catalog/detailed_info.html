{% extends "catalog/base.html" %}
{% block content %}
<div class="container">
    <h2>Информация о {{ product.name }}</h2>
    <div class="row text-center">
        <div class="col-3">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">{{ product.name }}</h4>
                </div>
                <div class="card-body">

                    <ul class="list-unstyled mt-3 mb-4 text-start m-3">
                        <li>- {{ product.description }} <img src="{{ product.image.url }}" alt="{{ product.name }}"></li>
                        <li>- {{ product.category }}</li>
                    </ul>
                    <h1 class="card-title pricing-card-title"> P {{ product.price_per_item }}</h1>
                    <a class="btn btn-lg btn-block btn-outline-primary" href="/product/list">Назад</a>
                </div>
            </div>

        </div>
    </div>
</div>>
{% endblock %}
