
<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Онлайн-магазин "Виртомаг"</h5>
    <nav class="ms-5">
        <a class="p-2 btn btn-outline-primary" href="/catalog/products/">Каталог</a>
        {% if user.is_authenticated %}
        <a class="p-2 btn btn-outline-primary" href="/catalog/products/new">Добавить</a>
        {% endif %}
        <a class="p-2 btn btn-outline-primary" href="/catalog/contacts/">Контакты</a>
            <ul class="navbar-nav ml-auto">
                {% if user.is_authenticated %}
                <p> Вы вошли как {{ user.username }} ({{ user.email }})</p>
                    <li class="nav-item">
	                    <form method="post" action="{% url 'users:logout' %}" style="display: inline;">
	                        {% csrf_token %}
	                        <button type="submit" class="btn btn-link nav-link">Выйти
	                        </button>
	                    </form>
	                </li>
                {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'users:login' %}">Войти</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'users:register' %}">Регистрация</a>
                    </li>
                {% endif %}
            </ul>
    </nav>
</div>
